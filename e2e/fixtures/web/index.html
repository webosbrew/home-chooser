<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HC Fixture web</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; color: #fff; }
  body.normal { background: #0a5a2a; }
  body.overlay { background: transparent; }
  #card { position: absolute; left: 0; right: 0; top: 40%; text-align: center; }
  body.overlay #card { top: auto; bottom: 0; height: 330px; background: rgba(0, 120, 200, 0.88); border: 6px solid #fff; box-sizing: border-box; }
  #id { font-size: 84px; font-weight: bold; margin-top: 30px; }
  #variant { font-size: 120px; font-weight: bold; color: #ffd800; }
  #count { font-size: 60px; }
</style>
</head>
<body>
<div id="card"><div id="id"></div><div id="variant"></div><div id="count"></div></div>
<script src="app.js"></script>
</body>
</html>

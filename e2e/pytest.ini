[pytest]
# e2e/ is the rootdir: `pytest e2e` runs the offline unit tests, `pytest e2e/device --vm ...` a VM run
# (e2e/README.md "Quick start").  The device plugin is loaded by conftest.py.
python_files = test_*.py
norecursedirs = results fixtures samples hc_e2e __pycache__ .*
# record_property (the phase's check counts) needs xunit1
junit_family = xunit1
# device runs log a short line per step and per check live (the plugin sets --log-cli-level=INFO unless
# given; DEBUG shows every runner line)
log_cli_format = %(asctime)s %(message)s
log_cli_date_format = %H:%M:%S
